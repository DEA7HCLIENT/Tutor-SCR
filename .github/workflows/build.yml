name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        id: proj
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip found in repo root"
            exit 1
          fi
          mkdir -p _project
          unzip -q -o "$ZIP" -d _project
          FILE=$(find _project -maxdepth 3 -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle not found inside the zip"
            find _project -maxdepth 3 | sort
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No gradlew in the repo, so install Gradle through the action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-dev.jar

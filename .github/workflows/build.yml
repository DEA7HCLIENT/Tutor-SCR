name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project directory
        id: proj
        run: |
          echo "Repo structure:"
          find . -maxdepth 3 -not -path './.git/*' | sort
          FILE=$(find . -maxdepth 3 -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle not found in the repo"
            exit 1
          fi
          DIR=$(di

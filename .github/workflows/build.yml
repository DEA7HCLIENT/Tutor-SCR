name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No gradlew in the repo, so install Gradle through the action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: DeathClientDLC
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC
          path: |
            DeathClientDLC/build/libs/*.jar
            !DeathClientDLC/build/libs/*-sources.jar
            !DeathClientDLC/build/libs/*-dev.jar
